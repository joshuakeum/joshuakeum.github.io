# The course registry that powers the "Courses" tab (`_tabs/courses.md`).
#
# Add one entry per course. Entries are grouped under their `term`, in the
# order the terms first appear in this file, so keep newest terms at the top.
#
# Fields
# ------
#   term        Required. Grouping header, e.g. "2025 Spring".
#   title       Required. The course title as you want it displayed.
#   code        Optional. Course code as your university writes it.
#   subject     Optional. Broad field, shown as a small label on the card.
#   category    Optional but recommended. Must match the SECOND element of a
#               post's `categories:` front matter. This is what links the card
#               to that course's archive page and counts its posts. With
#                   categories: [Mathematics, Linear Algebra]
#               the course entry needs `category: Linear Algebra`.
#               Leave it out for a course you have not written about yet.
#   instructor  Optional.
#   summary     Optional. One or two sentences on what the course covered.
#
- term: 2023 Spring
  code: "881.008"
  title: Introduction to Mathematical Analysis
  subject: Mathematics
  category: Mathematical Analysis
  instructor: Ja A Jeong (정자아)
  summary: >-
    A first rigorous course in real analysis at Seoul National
    University. The completeness of the real line and what follows from
    it, the topology of metric spaces,
    sequences, limits and continuity, differentiation, the Riemann and
    Riemann-Stieltjes integrals, series, and sequences of functions.

- term: 2023 Spring
  code: "3343.205"
  title: Organic Chemistry 1
  subject: Chemistry
  category: Organic Chemistry 1
  instructor: Seung Youn Hong (홍승윤)
  summary: >-
    The first half of the organic chemistry sequence at Seoul National
    University. Structure and bonding, thermodynamics and kinetics,
    acids and bases, functional groups and intermolecular forces,
    alkane nomenclature and conformational analysis, and radical
    halogenation.

- term: 2022 Spring
  code: L0442.000100
  title: Calculus 1
  subject: Mathematics
  category: Calculus 1
  instructor: Choi Hyung Gyu (최형규)
  summary: >-
    Mathematics 1 at Seoul National University. Infinite series and
    convergence, power series and the elementary functions, Taylor's
    theorem, then the vector geometry of space through to parametrized
    curves, arc length, and curvature.
