<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330"
     width="700" height="330" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Shearing a parallelogram keeps its area; stretching a side scales it</title>
  <desc id="figDesc">Two panels. Left: the parallelogram on u and v, and a second
parallelogram on u and v plus a u. Both stand on the same base u and reach the same
height, because the tip of v plus a u lies on the line through the tip of v parallel to
u, so the two areas are equal. Right: the parallelogram on u and v, and the one on u
and two v, which is made of two copies of the first stacked along v, so its area is
twice as large.</desc>
  <style>
    /* Base values are the validated light-mode palette the figures on this site use;
       both hues also clear 3:1 on the dark surface and the greys stay legible on
       either, so a viewer whose OS scheme and site theme disagree still gets a
       readable figure. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; }
    }
    .area  { fill:var(--curve); fill-opacity:0.14; stroke:none; }
    .area2 { fill:var(--vec); fill-opacity:0.12; stroke:none; }
    .edge  { stroke:var(--curve); stroke-width:1.8; fill:none; stroke-dasharray:6 6; }
    .edge2 { stroke:var(--vec); stroke-width:1.8; fill:none; stroke-dasharray:6 6; }
    .guide { stroke:var(--ink); stroke-width:1.4; fill:none; stroke-dasharray:2 6; }
    .vec   { stroke:var(--vec); stroke-width:3; fill:none; stroke-linecap:round; }
    .dot   { fill:var(--ink); }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lbl   { font-size:21px; font-style:italic; }
    .key   { font-size:19px; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--vec)"/>
    </marker>
  </defs>

  <!-- left panel: shear. origin (40,240), u = (150,0), v = (30,-150), v + a u = (130,-150) -->
  <line class="guide" x1="30" y1="90" x2="330" y2="90"/>
  <polygon class="area"  points="40,240 190,240 220,90 70,90"/>
  <polygon class="area2" points="40,240 190,240 320,90 170,90"/>
  <line class="edge"  x1="190" y1="240" x2="220" y2="90"/>
  <line class="edge2" x1="190" y1="240" x2="320" y2="90"/>
  <line class="vec" x1="40" y1="240" x2="190" y2="240" marker-end="url(#ah)"/>
  <line class="vec" x1="40" y1="240" x2="70"  y2="90"  marker-end="url(#ah)"/>
  <line class="vec" x1="40" y1="240" x2="170" y2="90"  marker-end="url(#ah)"/>
  <circle class="dot" cx="40" cy="240" r="5"/>
  <text class="lbl" x="118" y="266">u</text>
  <text class="lbl" x="42"  y="80">v</text>
  <text class="lbl" x="150" y="80">v + au</text>
  <text class="key" x="180" y="308" text-anchor="middle">same base, same height: equal areas</text>

  <!-- right panel: scaling. origin (420,240), u = (150,0), v = (25,-75), 2v = (50,-150) -->
  <polygon class="area"  points="420,240 570,240 595,165 445,165"/>
  <polygon class="area2" points="445,165 595,165 620,90 470,90"/>
  <line class="edge"  x1="445" y1="165" x2="595" y2="165"/>
  <line class="edge"  x1="570" y1="240" x2="595" y2="165"/>
  <line class="edge2" x1="595" y1="165" x2="620" y2="90"/>
  <line class="edge2" x1="470" y1="90"  x2="620" y2="90"/>
  <line class="vec" x1="420" y1="240" x2="570" y2="240" marker-end="url(#ah)"/>
  <line class="vec" x1="420" y1="240" x2="470" y2="90"  marker-end="url(#ah)"/>
  <circle class="dot" cx="420" cy="240" r="5"/>
  <circle class="dot" cx="445" cy="165" r="4"/>
  <text class="lbl" x="498" y="266">u</text>
  <text class="lbl" x="420" y="170">v</text>
  <text class="lbl" x="440" y="82">2v</text>
  <text class="key" x="530" y="308" text-anchor="middle">two copies: twice the area</text>
</svg>
