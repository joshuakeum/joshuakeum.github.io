<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340"
     width="700" height="340" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">A linear map and its matrix, related by the coordinate maps</title>
  <desc id="figDesc">A commutative square. Along the top, T maps the vector space V to
the vector space W and sends a vector v to T of v. Down the left side the coordinate
map phi beta sends V to F to the n, taking v to its coordinate vector relative to the
basis beta. Down the right side phi gamma sends W to F to the m. Along the bottom, left
multiplication by the matrix A sends F to the n to F to the m, taking the coordinate
vector of v to A times it, which is the coordinate vector of T of v relative to gamma.
Going across and then down gives the same result as going down and then across.</desc>
  <style>
    /* Base values are the validated light-mode palette the figures on this site use;
       the hue also clears 3:1 on the dark surface and the greys stay legible on
       either, so a viewer whose OS scheme and site theme disagree still gets a
       readable figure. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; }
    }
    .map   { stroke:var(--ink); stroke-width:2.2; fill:none; stroke-linecap:round; }
    .ind   { stroke:var(--vec); stroke-width:2.8; fill:none; stroke-linecap:round; }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .obj   { font-size:24px; }
    .lbl   { font-size:22px; font-style:italic; }
    .el    { font-size:20px; font-style:italic; }
    .sm    { font-size:17px; }
    .s     { font-size:14px; }
  </style>
  <defs>
    <marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--ink)"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--vec)"/>
    </marker>
  </defs>

  <!-- the four spaces -->
  <text class="obj" x="240" y="78"  text-anchor="middle">V</text>
  <text class="obj" x="460" y="78"  text-anchor="middle">W</text>
  <text class="obj" x="240" y="278" text-anchor="middle">F<tspan class="s" dy="-10">n</tspan></text>
  <text class="obj" x="460" y="278" text-anchor="middle">F<tspan class="s" dy="-10">m</tspan></text>

  <!-- the maps -->
  <line class="map" x1="264" y1="70"  x2="434" y2="70"  marker-end="url(#ahg)"/>
  <line class="map" x1="240" y1="94"  x2="240" y2="246" marker-end="url(#ahg)"/>
  <line class="map" x1="460" y1="94"  x2="460" y2="246" marker-end="url(#ahg)"/>
  <line class="ind" x1="270" y1="270" x2="430" y2="270" marker-end="url(#ah)"/>
  <text class="lbl" x="350" y="56"  text-anchor="middle">T</text>
  <text class="lbl" x="222" y="176" text-anchor="end">&#966;<tspan class="s" dy="6">&#946;</tspan></text>
  <text class="lbl" x="476" y="176">&#966;<tspan class="s" dy="6">&#947;</tspan></text>
  <text class="lbl" x="350" y="256" text-anchor="middle">L<tspan class="s" dy="6">A</tspan></text>

  <!-- what happens to one vector -->
  <text class="el" x="200" y="78"  text-anchor="end">v</text>
  <text class="el" x="500" y="78">T(v)</text>
  <text class="el" x="200" y="278" text-anchor="end">[v]<tspan class="s" dy="6">&#946;</tspan></text>
  <text class="el" x="500" y="278">A[v]<tspan class="s" dy="6">&#946;</tspan><tspan dy="-6"> = [T(v)]</tspan><tspan class="s" dy="6">&#947;</tspan></text>

  <text class="sm" x="350" y="322" text-anchor="middle">A is the matrix of T in the bases &#946; and &#947;</text>
</svg>
