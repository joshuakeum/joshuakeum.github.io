<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     width="700" height="400" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Adding two cosets does not depend on the representatives chosen</title>
  <desc id="figDesc">Four parallel lines in the plane: the subspace W through the origin
and, above it in order, the cosets x plus W, y plus W, and x plus y plus W. Arrows from
the origin show a vector x ending on the first coset, a vector y ending on the second,
and their sum x plus y, completed by a dashed parallelogram, ending on the third. Open
circles mark other representatives: x prime further along the coset of x, y prime
back along the coset of y, and their sum x prime plus y prime. That sum lands at a
different point, but on the same top line as x plus y, so the coset of the sum is the
same whichever representatives are used.</desc>
  <style>
    /* Base values are the validated light-mode palette the figures on this site use;
       both hues also clear 3:1 on the dark surface and the greys stay legible on
       either, so a viewer whose OS scheme and site theme disagree still gets a
       readable figure. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; }
    }
    .sub   { stroke:var(--curve); stroke-width:3.4; fill:none; stroke-linecap:round; }
    .coset { stroke:var(--curve); stroke-width:2; fill:none; stroke-linecap:round; }
    .vec   { stroke:var(--vec); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .sum   { stroke:var(--vec); stroke-width:3.6; fill:none; stroke-linecap:round; }
    .vdash { stroke:var(--vec); stroke-width:1.8; fill:none; stroke-dasharray:6 6; }
    .alt   { fill:none; stroke:var(--vec); stroke-width:2.6; }
    .dot   { fill:var(--ink); }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lbl   { font-size:22px; font-style:italic; }
    .key   { font-size:20px; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--vec)"/>
    </marker>
  </defs>

  <!-- the subspace and the three cosets involved -->
  <line class="sub"   x1="75.1" y1="381.3" x2="560.1" y2="259.8"/>
  <line class="coset" x1="67.8" y1="311.0" x2="557.7" y2="188.3"/>
  <line class="coset" x1="65.3" y1="260.1" x2="560.0" y2="136.1"/>
  <line class="coset" x1="67.7" y1="187.3" x2="560.5" y2="63.8"/>
  <text class="lbl" x="572" y="266">W</text>
  <text class="lbl" x="572" y="194">x + W</text>
  <text class="lbl" x="572" y="142">y + W</text>
  <text class="lbl" x="572" y="70">(x + y) + W</text>

  <!-- x, y and the parallelogram that gives x + y -->
  <line class="vdash" x1="368.5" y1="235.6" x2="358.7" y2="114.3"/>
  <line class="vdash" x1="230.2" y1="218.7" x2="358.7" y2="114.3"/>
  <line class="vec" x1="240" y1="340" x2="368.5" y2="235.6" marker-end="url(#ah)"/>
  <line class="vec" x1="240" y1="340" x2="230.2" y2="218.7" marker-end="url(#ah)"/>
  <line class="sum" x1="240" y1="340" x2="358.7" y2="114.3" marker-end="url(#ah)"/>
  <text class="lbl" x="322" y="298">x</text>
  <text class="lbl" x="206" y="286">y</text>
  <text class="lbl" x="352" y="100" text-anchor="end">x + y</text>

  <!-- other representatives of the same two cosets, and their sum -->
  <circle class="alt" cx="465.5" cy="211.3" r="7"/>
  <circle class="alt" cx="172.0" cy="233.3" r="7"/>
  <circle class="alt" cx="397.5" cy="104.6" r="7"/>
  <text class="lbl" x="460" y="244">x&#8242;</text>
  <text class="lbl" x="150" y="222">y&#8242;</text>
  <text class="lbl" x="414" y="72">x&#8242; + y&#8242;</text>

  <circle class="dot" cx="240" cy="340" r="6"/>
  <text class="key" x="226" y="366" text-anchor="end">0</text>
</svg>
