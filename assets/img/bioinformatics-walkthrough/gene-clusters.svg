  <path class="dna" d="M400,314 H680"/>
  <polygon class="g1" points="476,300 505,300 516,314 505,328 476,328"/>
  <text class="in" x="493.25" y="319" text-anchor="middle">X</text>
  <polygon class="g1" points="520,300 549,300 560,314 549,328 520,328"/>
  <text class="in" x="537.25" y="319" text-anchor="middle">Y</text>
  <polygon class="g1" points="564,300 593,300 604,314 593,328 564,328"/>
  <text class="in" x="581.25" y="319" text-anchor="middle">Z</text>
  <text x="540" y="356" text-anchor="middle">all three arrive: complete pathway</text>
  <text x="190" y="356" text-anchor="middle">one transferred segment</text>
  <text class="em" x="50" y="398">scattered genes</text>
  <path class="dna" d="M50,430 H330"/>
  <polygon class="g1" points="58,416 87,416 98,430 87,444 58,444"/>
  <text class="in" x="75.25" y="435" text-anchor="middle">X</text>
  <polygon class="g1" points="170,416 199,416 210,430 199,444 170,444"/>
  <text class="in" x="187.25" y="435" text-anchor="middle">Y</text>
  <polygon class="g1" points="282,416 311,416 322,430 311,444 282,444"/>
