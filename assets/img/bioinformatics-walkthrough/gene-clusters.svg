  <polygon class="g1" points="220,108 288,108 302,122 288,136 220,136"/>
  <polygon class="g1" points="308,108 358,108 372,122 358,136 308,136"/>
  <path class="prom" d="M398,122 V92 H418" marker-end="url(#ahk)"/>
  <text x="390" y="84">promoter</text>
  <polygon class="g2" points="426,108 506,108 520,122 506,136 426,136"/>
  <polygon class="g2" points="526,108 606,108 620,122 606,136 526,136"/>
  <path class="m1" d="M132,166 q7.05882,-5 14.1176,0 q7.05882,5 14.1176,0 q7.05882,-5 14.1176,0 q7.05882,5 14.1176,0 q7.05882,-5 14.1176,0 q7.05882,5 14.1176,0 q7.05882,-5 14.1176,0 q7.05882,5 14.1176,0 q7.05882,-5 14.1176,0 q7.05882,5 14.1176,0 q7.05882,-5 14.1176,0 q7.05882,5 14.1176,0 q7.05882,-5 14.1176,0 q7.05882,5 14.1176,0 q7.05882,-5 14.1176,0 q7.05882,5 14.1176,0 q7.05882,-5 14.1176,0"/>
  <path class="m2" d="M426,166 q6.92857,-5 13.8571,0 q6.92857,5 13.8571,0 q6.92857,-5 13.8571,0 q6.92857,5 13.8571,0 q6.92857,-5 13.8571,0 q6.92857,5 13.8571,0 q6.92857,-5 13.8571,0 q6.92857,5 13.8571,0 q6.92857,-5 13.8571,0 q6.92857,5 13.8571,0 q6.92857,-5 13.8571,0 q6.92857,5 13.8571,0 q6.92857,-5 13.8571,0 q6.92857,5 13.8571,0"/>
  <text x="252" y="194" text-anchor="middle">operon 1: one mRNA</text>
  <text x="523" y="194" text-anchor="middle">operon 2: one mRNA</text>

  <text class="panel" x="14" y="250">B</text>
  <text x="190" y="250" text-anchor="middle">donor genome</text>
  <text x="540" y="250" text-anchor="middle">recipient genome</text>
  <text class="em" x="50" y="282">clustered genes</text>
  <path class="dna" d="M50,314 H330"/>
  <polygon class="g1" points="126,300 155,300 166,314 155,328 126,328"/>
