  <rect class="seg" x="116" y="408" width="148" height="44" rx="5"/>
  <path class="move" d="M344,430 H390" marker-end="url(#aho)"/>
  <path class="dna" d="M400,430 H680"/>
  <polygon class="g1" points="520,416 549,416 560,430 549,444 520,444"/>
  <text class="in" x="537.25" y="435" text-anchor="middle">Y</text>
  <text x="540" y="472" text-anchor="middle">only Y arrives: incomplete pathway</text>
</svg>
