<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486"
     width="720" height="486" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">A gene cluster can span several operons, and clustered genes are transferred together</title>
  <desc id="figDesc">Panel A: five genes drawn as arrows on a line of DNA and bracketed as one gene
cluster. The first three follow one promoter and are transcribed into one mRNA, operon 1. The last
two follow a second promoter and are transcribed into another mRNA, operon 2. Panel B: two rows, each
with a donor genome on the left and a recipient genome on the right. In the first row the genes X, Y
and Z sit next to each other, one transferred DNA segment contains all three, and the recipient
receives the complete pathway. In the second row X, Y and Z are far apart, a segment of the same
length contains only Y, and the recipient receives an incomplete pathway.</desc>
  <style>
    /* Same palette and dark-mode handling as the other figures on this site. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; }
    }
    .dna   { stroke:var(--ink); stroke-width:2; fill:none; stroke-linecap:round; }
    .g1    { fill:var(--curve); }
    .g2    { fill:var(--vec); }
    .m1    { stroke:var(--curve); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .m2    { stroke:var(--vec); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .prom  { stroke:var(--ink); stroke-width:2; fill:none; stroke-linejoin:round; }
    .brk   { stroke:var(--ink); stroke-width:1.6; fill:none; }
    .seg   { stroke:var(--vec); stroke-width:2; fill:none; stroke-dasharray:6 5; }
    .move  { stroke:var(--vec); stroke-width:2.6; fill:none; stroke-linecap:round; }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px; }
    .panel { font-size:21px; font-weight:700; }
    .in    { fill:#fff; font-size:14px; font-weight:700; }
    .em    { font-style:italic; }
  </style>
  <defs>
    <marker id="ahk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--ink)"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--vec)"/>
    </marker>
  </defs>

  <text class="panel" x="14" y="30">A</text>
