<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     width="700" height="400" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The Hammond postulate: where the transition state sits in an exothermic and in an endothermic step</title>
  <desc id="figDesc">Two energy-against-reaction-coordinate plots side by side, each with the summit marked by a double dagger and a dashed line dropped to the horizontal axis. On the left the step is exothermic: the products lie below the reactants and the summit sits early along the reaction coordinate, close to the reactants in both energy and position, so the transition state resembles the reactants. On the right the step is endothermic: the products lie above the reactants and the summit sits late, close to the products, so the transition state resembles the products. The consequence is that differences in product stability show up in the barrier height of an endothermic step but not of an exothermic one.</desc>
  <style>
    /* Base values are the validated light-mode palette shared with the figures
       in the Calculus 1 series. Both hues clear 3:1 on the dark surface and the
       greys stay legible on either, so a viewer whose OS scheme and site theme
       disagree still gets a readable figure. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; --axis:#91918a; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; --axis:#6f6f68; }
    }
    .curve { stroke:var(--curve); stroke-width:3.2; fill:none; stroke-linecap:round;
              stroke-linejoin:round; }
    .thin  { stroke:var(--curve); stroke-width:2; fill:none; stroke-linecap:round; }
    .dot   { fill:var(--curve); }
    .vec   { stroke:var(--vec); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .vdot  { fill:var(--vec); }
    .vdash { stroke:var(--vec); stroke-width:1.8; fill:none; stroke-dasharray:6 6; }
    .ax    { stroke:var(--axis); stroke-width:1.6; fill:none; }
    .adash { stroke:var(--axis); stroke-width:1.6; fill:none; stroke-dasharray:7 7; }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lbl   { font-size:21px; }
    .key   { font-size:19px; }
    .sm    { font-size:16px; }
    .xs    { font-size:14px; }
    .hd    { font-size:20px; font-weight:600; }
    .em    { fill:var(--vec); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--vec)"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--axis)"/>
    </marker>
  </defs>
  <path class="ax" marker-end="url(#ahg)" d="M 58,352 L 58,57"/>
  <path class="ax" marker-end="url(#ahg)" d="M 58,352 L 333,352"/>
  <path class="curve" d="M 73,172 L 113,172 C 136.9,172 141.2,118 156.4,118 C 195.5,118 206.6,316 268,316 L 313,316"/>
  <path class="vdash" d="M 156.4,118 L 156.4,352"/>
  <text x="156.4" y="102.0" class="lbl" text-anchor="middle">‡</text>
  <text x="69.0" y="196.0" class="xs" text-anchor="start">reactants</text>
  <text x="313.0" y="340.0" class="xs" text-anchor="end">products</text>
  <text x="196.0" y="40.0" class="hd" text-anchor="middle">exothermic step</text>
  <text x="196.0" y="64.0" class="sm" text-anchor="middle">transition state is early:</text>
  <text x="196.0" y="82.0" class="sm" text-anchor="middle">it resembles the reactants</text>
  <text x="196.0" y="386.0" class="sm" text-anchor="middle">reaction coordinate</text>
  <text x="44.0" y="210.0" class="lbl" text-anchor="middle" font-style="italic">E</text>
  <path class="ax" marker-end="url(#ahg)" d="M 383,352 L 383,57"/>
  <path class="ax" marker-end="url(#ahg)" d="M 383,352 L 658,352"/>
  <path class="curve" d="M 398,316 L 438,316 C 501.1,316 512.6,140 552.7,140 C 566.8,140 570.8,196 593,196 L 638,196"/>
  <path class="vdash" d="M 552.7,140 L 552.7,352"/>
  <text x="552.7" y="124.0" class="lbl" text-anchor="middle">‡</text>
  <text x="394.0" y="340.0" class="xs" text-anchor="start">reactants</text>
  <text x="638.0" y="226.0" class="xs" text-anchor="end">products</text>
  <text x="521.0" y="40.0" class="hd" text-anchor="middle">endothermic step</text>
  <text x="521.0" y="64.0" class="sm" text-anchor="middle">transition state is late:</text>
  <text x="521.0" y="82.0" class="sm" text-anchor="middle">it resembles the products</text>
  <text x="521.0" y="386.0" class="sm" text-anchor="middle">reaction coordinate</text>
</svg>
