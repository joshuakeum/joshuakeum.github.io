<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     width="700" height="400" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Two reaction coordinate diagrams: the barrier and the overall energy change are independent</title>
  <desc id="figDesc">Two energy-against-reaction-coordinate plots side by side. On the left, the products lie well below the reactants, so the overall free energy change is large and negative and the reaction is favourable, but the hump between them is tall, so the activation energy is large and the reaction is slow. On the right, the products lie above the reactants, so the free energy change is positive and the reaction is unfavourable, yet the hump is low, so the activation energy is small and the reaction is fast. In each plot a double-headed arrow marks the activation energy from the reactant level up to the summit, and a second marks the overall change from the reactant level to the product level. The comparison shows that the height of the barrier and the position of the endpoints are independent quantities: thermodynamics and kinetics answer different questions.</desc>
  <style>
    /* Base values are the validated light-mode palette shared with the figures
       in the Calculus 1 series. Both hues clear 3:1 on the dark surface and the
       greys stay legible on either, so a viewer whose OS scheme and site theme
       disagree still gets a readable figure. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; --axis:#91918a; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; --axis:#6f6f68; }
    }
    .curve { stroke:var(--curve); stroke-width:3.2; fill:none; stroke-linecap:round;
              stroke-linejoin:round; }
    .thin  { stroke:var(--curve); stroke-width:2; fill:none; stroke-linecap:round; }
    .dot   { fill:var(--curve); }
    .vec   { stroke:var(--vec); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .vdot  { fill:var(--vec); }
    .vdash { stroke:var(--vec); stroke-width:1.8; fill:none; stroke-dasharray:6 6; }
    .ax    { stroke:var(--axis); stroke-width:1.6; fill:none; }
    .adash { stroke:var(--axis); stroke-width:1.6; fill:none; stroke-dasharray:7 7; }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lbl   { font-size:21px; }
    .key   { font-size:19px; }
    .sm    { font-size:16px; }
    .xs    { font-size:14px; }
    .hd    { font-size:20px; font-weight:600; }
    .em    { fill:var(--vec); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--vec)"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--axis)"/>
    </marker>
  </defs>
  <path class="ax" marker-end="url(#ahg)" d="M 58,352 L 58,57"/>
  <path class="ax" marker-end="url(#ahg)" d="M 58,352 L 333,352"/>
  <path class="curve" d="M 73,215 L 113,215 C 151.4,215 158.3,72 182.8,72 C 212.6,72 221.1,316 268,316 L 313,316"/>
  <path class="adash" d="M 113,215 L 309,215"/>
  <path class="vec" marker-start="url(#ah)" marker-end="url(#ah)" d="M 182.8,215.0 L 182.8,72.0"/>
  <text x="191.8" y="149.5" class="key" text-anchor="start">Eₐ</text>
  <path class="vec" marker-start="url(#ah)" marker-end="url(#ah)" d="M 295.0,215.0 L 295.0,316.0"/>
  <text x="286.0" y="271.5" class="key" text-anchor="end">ΔG°</text>
  <text x="196.0" y="40.0" class="hd" text-anchor="middle">favourable but slow</text>
  <text x="196.0" y="62.0" class="sm" text-anchor="middle">big ΔG°, big barrier</text>
  <text x="196.0" y="388.0" class="sm" text-anchor="middle">reaction coordinate</text>
  <text x="44.0" y="200.0" class="lbl" text-anchor="middle" font-style="italic">E</text>
  <path class="ax" marker-end="url(#ahg)" d="M 383,352 L 383,57"/>
  <path class="ax" marker-end="url(#ahg)" d="M 383,352 L 658,352"/>
  <path class="curve" d="M 398,292 L 438,292 C 482.3,292 490.4,206 518.6,206 C 544.6,206 552.1,248 593,248 L 638,248"/>
  <path class="adash" d="M 438,292 L 634,292"/>
  <path class="vec" marker-start="url(#ah)" marker-end="url(#ah)" d="M 518.6,292.0 L 518.6,206.0"/>
  <text x="527.6" y="255.0" class="key" text-anchor="start">Eₐ</text>
  <path class="vec" marker-start="url(#ah)" marker-end="url(#ah)" d="M 620.0,292.0 L 620.0,248.0"/>
  <text x="611.0" y="276.0" class="key" text-anchor="end">ΔG°</text>
  <text x="521.0" y="40.0" class="hd" text-anchor="middle">unfavourable but fast</text>
  <text x="521.0" y="62.0" class="sm" text-anchor="middle">small ΔG°, small barrier</text>
  <text x="521.0" y="334.0" class="xs" text-anchor="middle">uphill, but only just</text>
  <text x="521.0" y="388.0" class="sm" text-anchor="middle">reaction coordinate</text>
</svg>
