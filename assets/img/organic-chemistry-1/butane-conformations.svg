<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 604"
     width="700" height="604" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Energy of butane against the dihedral angle about the central bond</title>
  <desc id="figDesc">A potential energy curve for rotation about the C2 to C3 bond of butane, plotted over the first half of the rotation, from a dihedral angle of zero to one hundred and eighty degrees. The curve starts at its highest point, four point nine kilocalories per mole, where the two methyl groups eclipse each other. It falls to a shallow minimum of zero point nine at sixty degrees, the gauche conformation, which is staggered but has the two methyls only sixty degrees apart. It rises again to three point six at one hundred and twenty degrees, where a methyl eclipses a hydrogen, and falls to its global minimum of zero at one hundred and eighty degrees, the anti conformation, with the two methyls as far apart as they can get. Newman projections below the curve show each of the four conformations, with the methyl groups marked as solid dots; the front carbon bonds meet at the centre of the circle and the back carbon bonds emerge from its rim. The remaining half of the rotation mirrors this one.</desc>
  <style>
    /* Base values are the validated light-mode palette shared with the figures
       in the Calculus 1 series. Both hues clear 3:1 on the dark surface and the
       greys stay legible on either, so a viewer whose OS scheme and site theme
       disagree still gets a readable figure. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; --axis:#91918a; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; --axis:#6f6f68; }
    }
    .curve { stroke:var(--curve); stroke-width:3.2; fill:none; stroke-linecap:round;
              stroke-linejoin:round; }
    .thin  { stroke:var(--curve); stroke-width:2; fill:none; stroke-linecap:round; }
    .dot   { fill:var(--curve); }
    .vec   { stroke:var(--vec); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .vdot  { fill:var(--vec); }
    .vdash { stroke:var(--vec); stroke-width:1.8; fill:none; stroke-dasharray:6 6; }
    .ax    { stroke:var(--axis); stroke-width:1.6; fill:none; }
    .adash { stroke:var(--axis); stroke-width:1.6; fill:none; stroke-dasharray:7 7; }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lbl   { font-size:21px; }
    .key   { font-size:19px; }
    .sm    { font-size:16px; }
    .xs    { font-size:14px; }
    .hd    { font-size:20px; font-weight:600; }
    .em    { fill:var(--vec); }
  </style>
