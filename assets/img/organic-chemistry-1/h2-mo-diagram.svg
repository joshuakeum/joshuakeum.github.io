<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470"
     width="700" height="470" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Molecular orbital diagram for the hydrogen molecule</title>
  <desc id="figDesc">An energy level diagram. On the left and on the right sits a one s atomic orbital of a hydrogen atom, each holding one electron, drawn at the same energy. Between them are the two molecular orbitals they combine to give: a bonding sigma orbital below both atomic levels and an antibonding sigma star orbital above them, the antibonding orbital raised slightly further than the bonding one is lowered. Dashed lines connect each atomic orbital to both molecular orbitals. Both electrons drop into the bonding orbital with paired spins, leaving the antibonding orbital empty, so the bond order is one half of two minus zero, that is one. Sketches on the right show the antibonding orbital as two separate lobes with a node between the nuclei and the bonding orbital as a single region of electron density enclosing both.</desc>
  <style>
    /* Base values are the validated light-mode palette shared with the figures
       in the Calculus 1 series. Both hues clear 3:1 on the dark surface and the
       greys stay legible on either, so a viewer whose OS scheme and site theme
       disagree still gets a readable figure. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; --axis:#91918a; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; --axis:#6f6f68; }
    }
    .curve { stroke:var(--curve); stroke-width:3.2; fill:none; stroke-linecap:round;
              stroke-linejoin:round; }
    .thin  { stroke:var(--curve); stroke-width:2; fill:none; stroke-linecap:round; }
    .dot   { fill:var(--curve); }
    .vec   { stroke:var(--vec); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .vdot  { fill:var(--vec); }
    .vdash { stroke:var(--vec); stroke-width:1.8; fill:none; stroke-dasharray:6 6; }
    .ax    { stroke:var(--axis); stroke-width:1.6; fill:none; }
    .adash { stroke:var(--axis); stroke-width:1.6; fill:none; stroke-dasharray:7 7; }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lbl   { font-size:21px; }
    .key   { font-size:19px; }
    .sm    { font-size:16px; }
    .xs    { font-size:14px; }
    .hd    { font-size:20px; font-weight:600; }
    .em    { fill:var(--vec); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--vec)"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--axis)"/>
    </marker>
  </defs>
  <path class="ax" marker-end="url(#ahg)" d="M 40,420 L 40,70"/>
  <text x="24.0" y="250.0" class="lbl" text-anchor="middle" font-style="italic">E</text>
  <text x="170.0" y="62.0" class="hd" text-anchor="middle">H</text>
  <text x="530.0" y="62.0" class="hd" text-anchor="middle">H</text>
  <text x="350.0" y="62.0" class="hd" text-anchor="middle">H₂</text>
  <path class="thin" d="M 130,250 L 210,250"/>
  <text x="170.0" y="284.0" class="key" text-anchor="middle">1s</text>
  <path class="thin" d="M 490,250 L 570,250"/>
  <text x="530.0" y="284.0" class="key" text-anchor="middle">1s</text>
  <path class="curve" d="M 300,98 L 400,98"/>
  <path class="curve" d="M 300,386 L 400,386"/>
  <text x="414.0" y="92.0" class="lbl" text-anchor="start">σ*</text>
  <text x="414.0" y="394.0" class="lbl" text-anchor="start">σ</text>
  <text x="414.0" y="116.0" class="xs" text-anchor="start">antibonding</text>
  <text x="414.0" y="418.0" class="xs" text-anchor="start">bonding</text>
  <path class="adash" d="M 210,250 L 300,98"/>
  <path class="adash" d="M 210,250 L 300,386"/>
  <path class="adash" d="M 490,250 L 400,98"/>
  <path class="adash" d="M 490,250 L 400,386"/>
  <path class="vec" marker-end="url(#ah)" d="M 170,265 L 170,235"/>
  <path class="vec" marker-end="url(#ah)" d="M 530,265 L 530,235"/>
  <path class="vec" marker-end="url(#ah)" d="M 338,401 L 338,371"/>
  <path class="vec" marker-end="url(#ah)" d="M 362,371 L 362,401"/>
  <g opacity="0.95">
    <circle cx="597" cy="98" r="17" class="thin"/>
    <circle cx="645" cy="98" r="17" class="thin"/>
    <path class="vdash" d="M 621,70 L 621,126"/>
  <text x="621.0" y="148.0" class="xs" text-anchor="middle">node</text>
    <ellipse cx="621" cy="386" rx="36" ry="18" class="thin"/>
    <circle cx="605" cy="386" r="3.5" class="dot"/>
    <circle cx="637" cy="386" r="3.5" class="dot"/>
  </g>
  <text x="621.0" y="424.0" class="xs" text-anchor="middle">density between</text>
  <text x="621.0" y="440.0" class="xs" text-anchor="middle">the nuclei</text>
</svg>
