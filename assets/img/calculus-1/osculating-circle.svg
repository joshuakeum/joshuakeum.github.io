<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520"
     width="700" height="520" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The osculating circle of the parabola y equals x squared at the point one half, one quarter</title>
  <desc id="figDesc">The parabola y equals x squared is drawn, and at the point P with coordinates one half and one quarter a circle touches it. The circle has radius root two, which is one over the curvature there, and its centre O lies up and to the left of P along the unit normal; the radius joining them is marked one over kappa. A dashed grey line through P in the perpendicular direction is the tangent line. Near P the circle and the parabola run together and only separate slowly, because the circle matches the curve in position, in tangent direction and in curvature.</desc>
  <style>
    /* Base values are the validated light-mode palette, the one the earlier figures
       in this series use. Both hues clear 3:1 on the dark surface and the greys stay
       legible on either, so a viewer whose OS scheme and site theme disagree still
       gets a readable figure. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; --axis:#91918a; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; --axis:#6f6f68; }
    }
    .curve { stroke:var(--curve); stroke-width:3.2; fill:none; stroke-linecap:round; }
    .thin  { stroke:var(--curve); stroke-width:1.8; fill:none; }
    .dot   { fill:var(--curve); }
    .vec   { stroke:var(--vec); stroke-width:3.2; fill:none; stroke-linecap:round; }
    .vthin { stroke:var(--vec); stroke-width:2.2; fill:none; stroke-linecap:round; }
    .vdot  { fill:var(--vec); }
    .vdash { stroke:var(--vec); stroke-width:1.8; fill:none; stroke-dasharray:6 6; }
    .plane { fill:var(--vec); fill-opacity:0.10; stroke:var(--vec); stroke-width:2; }
    .ax    { stroke:var(--axis); stroke-width:1.6; fill:none; }
    .adash { stroke:var(--axis); stroke-width:1.8; fill:none; stroke-dasharray:7 7; }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lbl   { font-size:22px; font-style:italic; }
    .key   { font-size:20px; }
    .sm    { font-size:17px; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--vec)"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--curve)"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0.8 L 9.6,5 L 0,9.2 z" fill="var(--axis)"/>
    </marker>
  </defs>

