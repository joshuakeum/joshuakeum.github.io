<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 378"
     width="700" height="378" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">One arch of a cycloid, with the rolling wheel and its two cusps</title>
  <desc id="figDesc">A wheel of radius one rolls without slipping along a horizontal line. A marked point on its rim traces one arch of a cycloid, rising to height two at the top and returning to the line. The wheel is drawn dashed at one intermediate position, with a spoke from its centre to the marked point and a vertical line down to the point where it touches the ground. At each end of the arch the curve comes to a cusp. Short arrows there show the direction of travel: the point leaves the first cusp straight up, along the vector zero one, and arrives at the second straight down, along zero minus one. The speed is zero at both, so the direction of travel reverses through half a turn over no distance at all, which is why the cusp is genuinely sharp. The arch has length eight and encloses area three pi.</desc>
  <style>
    /* Base values are the validated light-mode palette, the one the earlier figures
       in this series use. Both hues clear 3:1 on the dark surface and the greys stay
       legible on either, so a viewer whose OS scheme and site theme disagree still
       gets a readable figure. */
    svg { --curve:#2a78d6; --vec:#eb6834; --ink:#7a7a74; --axis:#91918a; }
    @media (prefers-color-scheme: dark) {
      svg { --curve:#3987e5; --vec:#d95926; --ink:#c3c2b7; --axis:#6f6f68; }
    }
    .curve { stroke:var(--curve); stroke-width:3.2; fill:none; stroke-linecap:round; }
    .thin  { stroke:var(--curve); stroke-width:1.8; fill:none; }
    .dot   { fill:var(--curve); }
    .vec   { stroke:var(--vec); stroke-width:3.2; fill:none; stroke-linecap:round; }
    .vthin { stroke:var(--vec); stroke-width:2.2; fill:none; stroke-linecap:round; }
    .vdot  { fill:var(--vec); }
    .vdash { stroke:var(--vec); stroke-width:1.8; fill:none; stroke-dasharray:6 6; }
    .plane { fill:var(--vec); fill-opacity:0.10; stroke:var(--vec); stroke-width:2; }
    .ax    { stroke:var(--axis); stroke-width:1.6; fill:none; }
    .adash { stroke:var(--axis); stroke-width:1.8; fill:none; stroke-dasharray:7 7; }
    text   { fill:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lbl   { font-size:22px; font-style:italic; }
    .key   { font-size:20px; }
    .sm    { font-size:17px; }
  </style>
